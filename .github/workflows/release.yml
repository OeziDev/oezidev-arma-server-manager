name: Release

# packages/app/package.json içindeki sürüm artırılıp main'e pushlanınca (ya da "v1.2.3" etiketi
# pushlanınca) testleri çalıştırır, Windows kurulumunu derler ve GitHub Release'e yükler.
# O sürümün Release'i zaten varsa hiçbir şey yapmaz. Kurulu uygulamalar bu Release'teki latest.yml'yi okur.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.v.outputs.release }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./packages/app/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$v zaten yayında, derleme atlanıyor"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows:
    needs: [check, test]
    if: needs.check.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sürüm etiketle aynı mı
        shell: bash
        run: |
          v=$(node -p "require('./packages/app/package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "packages/app/package.json sürümü ($v) etiketle ($GITHUB_REF_NAME) uyuşmuyor"; exit 1
          fi
      - run: npm run build -w packages/app
      - name: Derle ve Release'e yükle
        working-directory: packages/app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish always
