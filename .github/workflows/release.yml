name: Release

# packages/app/package.json içindeki sürüm artırılıp main'e pushlanınca (ya da "v1.2.3" etiketi
# pushlanınca) testleri çalıştırır, Windows kurulumunu derler ve GitHub Release'e yükler.
# O sürümün Release'i zaten varsa hiçbir şey yapmaz. Kurulu uygulamalar bu Release'teki latest.yml'yi okur.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.v.outputs.release }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./packages/app/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # Release var ve latest.yml yüklüyse işimiz yok (yarım kalmış bir Release tamamlanır)
          if gh release view "v$v" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx latest.yml; then
            echo "v$v zaten yayında, derleme atlanıyor"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows:
    needs: [check, test]
    if: needs.check.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sürüm etiketle aynı mı
        shell: bash
        run: |
          v=$(node -p "require('./packages/app/package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "packages/app/package.json sürümü ($v) etiketle ($GITHUB_REF_NAME) uyuşmuyor"; exit 1
          fi
      - run: npm run build -w packages/app
      - name: Derle
        working-directory: packages/app
        run: npx electron-builder --win --x64 --publish never
      - name: Release'e yükle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ needs.check.outputs.version }}"
          cd packages/app/release
          ls -la
          files=("OeziDev-Arma-Server-Manager-Setup-$v.exe" "OeziDev-Arma-Server-Manager-Setup-$v.exe.blockmap" "OeziDev-Arma-Server-Manager-$v-portable.exe")
          if gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$v" -R "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          else
            gh release create "v$v" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$v" \
              --notes "Kurulum: OeziDev-Arma-Server-Manager-Setup-$v.exe. Kurulu sürümler kendini otomatik günceller." \
              "${files[@]}"
          fi
          # latest.yml en son: güncelleme ancak exe tam yüklendikten sonra görünür
          gh release upload "v$v" -R "$GITHUB_REPOSITORY" --clobber latest.yml
